# Configuracion de pruebas: reemplaza a src/main/resources/application.properties
# y usa H2 en memoria (modo MySQL) para no depender de un servidor externo.
spring.application.name=udeabank
app.version=test
app.commit=test

spring.datasource.url=jdbc:h2:mem:udeabank;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
