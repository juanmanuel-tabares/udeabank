spring.application.name=udeabank
# Render (y otros PaaS) inyectan el puerto en PORT; en local se usa SERVER_PORT u 8080.
server.port=${PORT:${SERVER_PORT:8080}}

# Version (filtrada por Maven) y commit desplegado, expuestos en /api/version.
# APP_COMMIT lo fija el pipeline al construir la imagen Docker.
app.version=@project.version@
app.commit=${APP_COMMIT:local}

# Carga las credenciales desde el archivo .env de la raiz del proyecto, que no
# se versiona. "optional:" evita que la aplicacion falle al arrancar si el
# archivo no existe (por ejemplo, cuando las variables vienen del entorno).
spring.config.import=optional:file:.env[.properties]

# DB_SSL_MODE=DISABLED en local; REQUIRED para MySQL administrado (Aiven) que exige TLS.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:udeabank}?sslMode=${DB_SSL_MODE:DISABLED}&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate 6+/7 elimino MySQL8Dialect. Se puede omitir (autodeteccion) o usar MySQLDialect:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.favor-path-extension=false
