spring.application.name=udeabank
server.port=${SERVER_PORT:8080}

# Carga las credenciales desde el archivo .env de la raiz del proyecto, que no
# se versiona. "optional:" evita que la aplicacion falle al arrancar si el
# archivo no existe (por ejemplo, cuando las variables vienen del entorno).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:udeabank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate 6+/7 elimino MySQL8Dialect. Se puede omitir (autodeteccion) o usar MySQLDialect:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.favor-path-extension=false
